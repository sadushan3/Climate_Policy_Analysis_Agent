services:
  api:
    build: ./Backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: prod
      LOG_JSON: "true"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:4173"
      # Required in prod -- the API refuses to start without it. Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set; see README}"
      # Optional. Everything works without it; setting it enables grounded Q&A,
      # abstractive summaries and the written comparison narrative.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      # Documents, the SQLite catalogue and the vector index survive a rebuild.
      - policy-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  web:
    build: ./Frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  policy-data:
