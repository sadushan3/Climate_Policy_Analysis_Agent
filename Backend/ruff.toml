line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # FastAPI's Depends()/File() defaults are the documented idiom
]

[lint.per-file-ignores]
"tests/*" = ["E402"]   # sys.path setup must precede app imports
"app/nlp/embeddings.py" = ["E402"]  # env vars must be set before transformers imports
