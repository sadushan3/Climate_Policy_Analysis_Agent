name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, test, eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      TRANSFORMERS_NO_TF: "1"
      USE_TF: "0"
      TOKENIZERS_PARALLELISM: "false"
      # Fixed test secret: deterministic runs, and never a real credential.
      JWT_SECRET: "ci-only-secret-not-used-anywhere-else"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements-dev.txt

      # Model weights are ~120 MB and unchanged between runs.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('Backend/requirements.txt') }}

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: ruff check app tests eval

      - name: Test
        run: pytest -q

      # The eval is a gate, not a report: a change that degrades classification
      # or target extraction fails the build instead of shipping quietly.
      # Scores the held-out test splits and fails the build if any quality floor
      # is breached. The floors live in eval/run_eval.py next to the metrics.
      - name: Evaluate model quality
        run: python -m eval.run_eval --ablate --check --json eval-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: Backend/eval-results.json

  frontend:
    name: Frontend — lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
